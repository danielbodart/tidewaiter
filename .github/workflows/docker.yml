name: Build and publish

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege for the built-in token. Read-only by default, and widened
# only on the jobs that publish: build pushes to GitHub's registry, and release
# creates a tag and a release.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise.toml is the one place Go's version is pinned, for CI and for
      # anyone working on this locally.
      - uses: jdx/mise-action@v4

      - name: Format and vet
        run: ./run check

      - name: Test
        run: ./run test

  # The flake: the package (its build runs the tests), the module evaluation
  # and the NixOS VM test, which boots a host whose managed unit a player is
  # using, through a swap, a rollback and a reboot. Deliberately not in the
  # publishing jobs' `needs`: a VM test is slow and can be flaky on shared
  # runners, and a flaky VM must not block a release. A red run here is still a
  # red build to fix.
  nix:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the flake's version has its commit count.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Hosted runners have /dev/kvm, but not readable by the runner's user;
      # without it the VM test falls back to emulation, many times slower.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31

      - name: VM test
        run: nix build -L .#checks.x86_64-linux.vm

      # Everything else in the flake, the VM test already built above.
      - name: Flake check
        run: nix flake check -L

  build:
    runs-on: ubuntu-latest
    # Nothing is published unless the tests pass.
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      # The whole history, because the version's minor is the commit count and
      # the default shallow checkout would make every build claim to be the
      # first. ./run refuses to compute a version from a shallow clone rather
      # than publish a wrong one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only here to run ./run, which is the single place the version is
      # defined - deriving it again in shell would be a second definition to
      # keep in step with the first.
      - uses: jdx/mise-action@v4

      - name: Version
        id: version
        run: echo "value=$(./run version)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Push on any master-branch run that is not a pull request - so both a
      # push and a manual workflow_dispatch publish, while a PR (which may come
      # from a fork) only builds and never sees the credentials.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # The same image on GitHub's registry, for anyone who would rather not
      # depend on Docker Hub's pull limits. The built-in token is enough, and
      # the image's org.opencontainers.image.source label links the package to
      # this repository.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # ARM matters here: the target is a homelab that may well be an ARM
          # box, and not always a 64-bit one - armv7 is the Pi 2 onwards on
          # 32-bit Raspberry Pi OS, which Bun could never build for. No QEMU is
          # involved - Go cross-compiles from the build platform, so each
          # architecture costs seconds.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          # Both tags point at the same image. :latest is what compose pulls;
          # the exact version is what makes it possible to pin one, and to roll
          # back to one.
          tags: |
            danielbodart/tidewaiter:latest
            danielbodart/tidewaiter:${{ steps.version.outputs.value }}
            ghcr.io/danielbodart/tidewaiter:latest
            ghcr.io/danielbodart/tidewaiter:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The binaries for running Tidewaiter natively under systemd, on a host
  # without NixOS, which builds its own from the flake. One release per
  # published image, tagged with the image's version, so the two never disagree
  # about what a version is, and nothing needs bumping to release either.
  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      # Every architecture's binary, the unit and their checksums, into
      # dist/release.
      - name: Build
        run: ./run release

      # Same commit, same run, so ./run derives the same version the image was
      # published as. Checked rather than assumed, since a release whose binary
      # disagrees with its tag is worse than no release.
      - name: Check the version
        run: |
          built=$(dist/release/tidewaiter-linux-x64 --version 2>/dev/null)
          [ "$built" = "$VERSION" ] || { echo "the binary says $built but the image is $VERSION"; exit 1; }

      # The plain unit has no VM test of its own - nix/vm-test.nix runs the
      # module's - so it is at least checked against a real systemd, with the
      # binary where it expects to find it.
      - name: Verify the systemd unit
        run: |
          sudo install -m 755 dist/release/tidewaiter-linux-x64 /usr/local/bin/tidewaiter
          systemd-analyze verify systemd/tidewaiter.service

      # A re-run has the same run number and so the same version, so the
      # release may already exist: its assets are replaced rather than the job
      # failing.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
          else
            {
              git log -1 --format=%B "$GITHUB_SHA"
              echo
              echo "Image: \`danielbodart/tidewaiter:$VERSION\` or \`ghcr.io/danielbodart/tidewaiter:$VERSION\`"
            } > notes.md
            gh release create "$tag" dist/release/* --target "$GITHUB_SHA" --title "$tag" --latest --notes-file notes.md
          fi

  # Docker Hub no longer syncs a README from GitHub, so the page has to be
  # pushed over the API. Kept in its own job and allowed to fail, because it is
  # cosmetic: the image is what a release is.
  description:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: danielbodart/tidewaiter
          short-description: "Update Docker containers only when idle, health-gate the swap, roll back on failure"
          readme-filepath: ./README.md
